dataset_params:
  im_path: 'data/imagenet'
  im_channels : 3
  im_size : 256
  name: 'IMAGENET'
  val_num_samples : 10000
  latent_channels : 12

train_params:
  seed : 661
  task_name: 'IMG_VAE_12x64x64'
  batch_size: 64
  val_batch_size : 64
  disc_weight: 0.1
  disc_start: 300  
  disc_ramp_steps: 100
  r1_gamma: 0.0
  r1_every: 100000000000000000 
  use_adaptive_weight : True 
  perceptual_weight: 1
  kl_weight: 0.000001
  drop_p: 1e-8
  lambda_reg : 0.0
  max_train_steps: 100000
  lr: 0.0001
  acc_steps : 2
  img_save_steps: 1000
  save_steps : 1500
  eval_steps : 1000
  autoencoder_ckpt_name: 'vae.pth'
